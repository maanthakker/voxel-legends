# Render Blueprint: one web service serves the React app, the API and the multiplayer socket.
services:
  - type: web
    name: voxel-realms
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false          # paste your MongoDB Atlas connection string when Render asks
      - key: JWT_SECRET
        generateValue: true  # Render creates a random secret for login tokens
